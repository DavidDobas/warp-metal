[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "warp-metal"
version = "1.18.0.dev2026091702"
description = "Apple Metal backend for NVIDIA Warp: run Warp kernels on Apple Silicon GPUs"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "David Dobas" }]
keywords = ["warp", "metal", "apple-silicon", "gpu", "simulation", "mujoco"]
classifiers = [
  "Operating System :: MacOS",
  "Environment :: GPU",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "warp-lang==1.18.0.dev20260917",
]

[project.urls]
Repository = "https://github.com/DavidDobas/warp-metal"
"Warp fork" = "https://github.com/DavidDobas/warp"

[tool.hatch.build.targets.wheel]
packages = ["src/warp_metal"]
# generated by tools/generate.py and ignored by git, so they have to be named here
artifacts = [
  "src/warp_metal/_generated.py",
  "src/warp_metal/_overlay/**",
  "src/warp_metal/native/**",
  "src/warp_metal/bin/*.dylib",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel.force-include]
"warp_metal_boot.pth" = "warp_metal_boot.pth"

[tool.hatch.build.targets.sdist]
include = ["src", "tools", "hatch_build.py", "README.md", "LICENSE", "NOTICE", "warp_metal_boot.pth", "pyproject.toml"]
